<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- No-flash theme script: applies saved theme before first paint -->
  <script>
    (function(){
      var t = localStorage.getItem('dashboard_theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>
<body>
  <header>
    <section id="greeting">
      <!-- Greeting text with inline edit-name button -->
      <div id="greeting-left">
        <span id="greeting-text"></span><button id="edit-name-btn" aria-label="Edit name" title="Edit name">✏️</button>
      </div>
      <p id="current-time"></p>
      <p id="current-date"></p>
      <!-- Light / Dark mode toggle -->
      <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
    </section>
  </header>

  <main>
    <!-- Focus Timer -->
    <section id="focus-timer">
      <h2>Focus Timer</h2>
      <div id="timer-display">25:00</div>
      <div id="timer-notification" class="hidden"></div>
      <div class="timer-controls">
        <button id="timer-start">Start</button>
        <button id="timer-stop">Stop</button>
        <button id="timer-reset">Reset</button>
      </div>
    </section>

    <!-- To-Do List -->
    <section id="todo">
      <h2>To-Do List</h2>
      <div class="todo-input-row">
        <input type="text" id="todo-input" placeholder="Add a new task…" />
        <button id="todo-add">Add Task</button>
      </div>
      <!-- Sort controls -->
      <div id="sort-controls">
        <button class="sort-btn active" data-sort="default">Default</button>
        <button class="sort-btn" data-sort="az">A → Z</button>
        <button class="sort-btn" data-sort="za">Z → A</button>
        <button class="sort-btn" data-sort="done-last">Done Last</button>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <!-- Quick Links -->
    <section id="quick-links">
      <h2>Quick Links</h2>
      <div id="links-grid"></div>
      <form id="link-form" novalidate>
        <input type="text" id="link-name" placeholder="Name" required />
        <input type="url" id="link-url" placeholder="https://example.com" required />
        <button type="submit" id="link-add">Add Link</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Life Dashboard &mdash; built with HTML, CSS &amp; Vanilla JS</p>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
